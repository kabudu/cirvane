name: Feature request
description: Propose a narrowly scoped, evidence-backed capability.
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator or developer problem without prescribing architecture.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: State the behavioural proof and hardware boundary where relevant.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, performance and compatibility risks
    validations:
      required: true
