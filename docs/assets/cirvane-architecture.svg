<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How Cirvane works</title>
  <desc id="desc">Operator inputs enter bounded services and a fixed message pool. Supervision, recovery policy, configuration records and signed dual-slot updates keep outcomes explicit above the ESP-IDF, FreeRTOS and ESP32-C5 platform boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24182e"/>
      <stop offset="0.58" stop-color="#3a2748"/>
      <stop offset="1" stop-color="#123d42"/>
    </linearGradient>
    <linearGradient id="channel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73cbc3" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#73cbc3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#73cbc3" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b0910" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ed6ce"/>
    </marker>
    <style>
      .label{font:700 14px system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase}
      .title{font:750 25px system-ui,sans-serif;letter-spacing:-.4px}
      .body{font:500 15px system-ui,sans-serif}
      .small{font:600 13px system-ui,sans-serif}
      .card{fill:#30223b;stroke:#745f82;stroke-width:1.5}
      .service{fill:#f8f6ef;stroke:#cde7e2;stroke-width:2}
      .flow{fill:none;stroke:#8ed6ce;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="80" r="155" fill="#0e7c78" opacity="0.13"/>
  <circle cx="1040" cy="630" r="230" fill="#6f2e6d" opacity="0.14"/>

  <text x="56" y="56" class="label" fill="#8ed6ce">Cirvane runtime architecture</text>
  <text x="56" y="91" class="title" fill="#ffffff">Bounded work. Explicit recovery. Inspectable outcomes.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="126" width="1088" height="90" rx="18" class="card"/>
    <text x="82" y="156" class="label" fill="#8ed6ce">Operator and network edge</text>
    <g class="small" fill="#ffffff">
      <rect x="82" y="173" width="180" height="28" rx="14" fill="#0e7c78"/><text x="172" y="192" text-anchor="middle">Privileged USB shell</text>
      <rect x="278" y="173" width="150" height="28" rx="14" fill="#523c60"/><text x="353" y="192" text-anchor="middle">Wi-Fi station</text>
      <rect x="444" y="173" width="202" height="28" rx="14" fill="#523c60"/><text x="545" y="192" text-anchor="middle">Signed HTTPS updates</text>
      <rect x="662" y="173" width="202" height="28" rx="14" fill="#523c60"/><text x="763" y="192" text-anchor="middle">Clear diagnostics</text>
      <rect x="880" y="173" width="238" height="28" rx="14" fill="#523c60"/><text x="999" y="192" text-anchor="middle">Fail-closed input checks</text>
    </g>
  </g>

  <path d="M600 216 V246" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="56" y="252" width="710" height="196" rx="20" fill="#f8f6ef"/>
    <text x="82" y="284" class="label" fill="#0e7c78">Bounded execution plane</text>
    <g>
      <rect x="82" y="306" width="148" height="82" rx="14" class="service"/>
      <circle cx="108" cy="330" r="8" fill="#0e7c78"/><text x="126" y="336" class="title" font-size="18" fill="#24182e">Heartbeat</text>
      <text x="108" y="365" class="small" fill="#62686b">fixed identity</text>
      <rect x="246" y="306" width="148" height="82" rx="14" class="service"/>
      <circle cx="272" cy="330" r="8" fill="#0e7c78"/><text x="290" y="336" class="title" font-size="18" fill="#24182e">Wi-Fi</text>
      <text x="272" y="365" class="small" fill="#62686b">bounded waits</text>
      <rect x="410" y="306" width="148" height="82" rx="14" class="service"/>
      <circle cx="436" cy="330" r="8" fill="#0e7c78"/><text x="454" y="336" class="title" font-size="18" fill="#24182e">OTA</text>
      <text x="436" y="365" class="small" fill="#62686b">verify first</text>
      <rect x="574" y="306" width="166" height="82" rx="14" class="service"/>
      <circle cx="600" cy="330" r="8" fill="#0e7c78"/><text x="618" y="336" class="title" font-size="18" fill="#24182e">Diagnostics</text>
      <text x="600" y="365" class="small" fill="#62686b">visible state</text>
    </g>
    <rect x="82" y="405" width="658" height="25" rx="12.5" fill="#24182e"/>
    <rect x="91" y="412" width="470" height="11" rx="5.5" fill="url(#channel)"/>
    <text x="726" y="423" class="small" text-anchor="end" fill="#ffffff">fixed message pool and queue depth</text>
  </g>

  <path d="M766 350 H803" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="810" y="252" width="334" height="196" rx="20" fill="#2d2037" stroke="#8ed6ce" stroke-width="2"/>
    <text x="838" y="284" class="label" fill="#8ed6ce">Recovery control</text>
    <path d="M854 321 C854 294 902 294 902 321 C902 348 854 348 854 321" fill="none" stroke="#73cbc3" stroke-width="5"/>
    <path d="M894 303 L909 307 L900 319" fill="#73cbc3"/>
    <text x="930" y="321" class="title" fill="#ffffff">Supervise</text>
    <text x="838" y="357" class="body" fill="#d6cedb">health checks · restart budget</text>
    <text x="838" y="382" class="body" fill="#d6cedb">backoff · degraded state</text>
    <rect x="838" y="402" width="278" height="28" rx="8" fill="#0e7c78"/>
    <text x="977" y="421" class="small" text-anchor="middle" fill="#ffffff">record one deterministic outcome</text>
  </g>

  <path d="M390 448 V477" class="flow"/>
  <path d="M977 448 V477" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="56" y="483" width="1088" height="104" rx="20" class="card"/>
    <text x="82" y="515" class="label" fill="#8ed6ce">Recovery state</text>
    <g class="small" fill="#ffffff">
      <rect x="82" y="532" width="234" height="36" rx="10" fill="#523c60"/><text x="199" y="555" text-anchor="middle">CRC configuration A / B</text>
      <rect x="333" y="532" width="234" height="36" rx="10" fill="#523c60"/><text x="450" y="555" text-anchor="middle">signed firmware slot 0</text>
      <rect x="584" y="532" width="234" height="36" rx="10" fill="#523c60"/><text x="701" y="555" text-anchor="middle">signed firmware slot 1</text>
      <rect x="835" y="532" width="283" height="36" rx="10" fill="#0e7c78"/><text x="976" y="555" text-anchor="middle">confirm healthy or roll back</text>
    </g>
  </g>

  <path d="M600 587 V610" class="flow"/>
  <rect x="56" y="616" width="1088" height="40" rx="12" fill="#15101b" stroke="#745f82"/>
  <text x="80" y="641" class="small" fill="#cde7e2">CURRENT PRODUCT BOUNDARY</text>
  <text x="1118" y="641" class="small" text-anchor="end" fill="#ffffff">Cirvane · ESP-IDF · FreeRTOS · Seeed Studio XIAO ESP32-C5</text>
</svg>
